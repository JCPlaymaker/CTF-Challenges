description:
  fr: |
    La Résistance a intercepté un fichier provenant de SelectStar Industries, mais son contenu semble avoir été sérieusement perturbé.
    Un certain maître vert aurait laissé sa marque… peut-être que son nom est la première clé à essayer.
    Et comme toujours avec lui, tout semble être une question de choix… exclusif.
    Rétablissez l’ordre dans les octets et découvrez le message caché.
    May the bytes be with you.

  en: |

    The Resistance intercepted a file from SelectStar Industries, but its contents seem to have been seriously disturbed.
    A certain green master appears to have left his mark… perhaps his name is the first key worth trying.
    And as always with him, everything seems to come down to an exclusive choice.
    Restore order to the bytes and uncover the hidden message.
    May the bytes be with you.

